<!DOCTYPE html>
<html>
<head>
  <title>Crypto Test</title>
</head>
<body>

<h2>Crypto Prices</h2>
<div id="crypto"></div>

<script>
fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,solana,cardano,tron")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("crypto");

    data.forEach(coin => {
      const div = document.createElement("div");

      div.innerHTML = `
        <img src="${coin.image}" width="30" />
        <strong>${coin.name}</strong> - $${coin.current_price}
      `;

      container.appendChild(div);
    });
  })
  .catch(err => console.log(err));
</script>

</body>
</html>
